<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exactly matchy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">Rendered-page retrieval probe</p>
      <h1>exactly matchy</h1>
      <p id="model-status" class="status">Checking Chrome AI…</p>
    </header>

    <main>
      <label>
        Prompts
        <input id="count" type="number" min="3" max="8" value="5" />
      </label>
      <button id="analyze" class="primary" type="button">Analyze this page</button>
      <p id="error" class="error" role="alert"></p>

      <section id="results" hidden>
        <div class="results-heading">
          <h2>Selected passages</h2>
          <button id="copy-all" type="button">Copy all</button>
        </div>
        <p id="page-title" class="muted"></p>
        <div id="prompt-list"></div>
      </section>
    </main>

    <footer>
      <p>
        Page text and model selection stay on this device. On Gemini, this extension
        transfers the link's prompt into the conversation box without submitting it.
      </p>
      <nav class="creator-links" aria-label="Creator links">
        <span>By <a href="https://www.chris-green.net/" target="_blank" rel="noopener noreferrer">chris-green.net</a></span>
        <a href="https://www.linkedin.com/in/chrisgreenseo/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://x.com/chrisgreenseo" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://bsky.app/profile/chris-green.net" target="_blank" rel="noopener noreferrer">Bluesky</a>
        <a href="https://www.youtube.com/@ChrisGreenSEO" target="_blank" rel="noopener noreferrer">YouTube</a>
      </nav>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
