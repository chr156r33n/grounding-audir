name: Deploy Prompt Creator Worker

on:
  push:
    branches: [main]
    paths:
      - "prompt_creator_cf/**"
      - ".github/workflows/deploy-prompt-creator-cf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-creator-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt_creator_cf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
